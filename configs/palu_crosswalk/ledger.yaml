# Palu mapping ledger. This file is a decision package for Jlin, not a freeze.
# Official source of truth for Palu ground reference is the Paulik 2019 PDF
# plus the publisher xlsx Buildings sheet. Earlier DS1/DS2/DS3 candidate
# schemes are not the mapping and must not be applied. Do not copy raw
# PDF/xlsx/geojson/gpkg files into git.

