frozen_mappings:
  - id: steer_wind
    hazard: wind
    status: approved
    frozen: true
    code_F_from: component_fields_never_from_the_grade
    source: "Prevatt and Roueche, 15 June 2020, Hurricane Michael Data Enhancement (Phase II), Report No. 06-20, University of Florida, for Florida DBPR, Project P0157245, Table 4 and Table 5, printed p. 15."
    rules:
      "0": "no"
      "1": minor_does_not_satisfy_F
      "2": minor_never_major
      "3": major_only_with_recorded_partial_roof_or_wall_structural_failure_otherwise_minor_or_unknown
      "4": "default_major_in_Q; promote_to_destroyed_only_with_explicit_collapse_or_no_longer_present_or_living_area_wall_structure_failure_and_no_intact_roof; table4_shading_is_not_a_promotion_rule; missing_fields_stay_major"
      "-1": excluded_from_wind_Y_not_no_damage
    notes: "Already frozen. This worktree must not change these rules."

  - id: dins_affected_to_no
    hazard: wildfire
    status: approved
    frozen: true
    source: "docs/eval_protocol.md Label section, CAL FIRE DINS"
    rules:
      "Affected": "no"
    notes: "Frozen. No rollback. Pre-registered sensitivities (Affected → minor, Affected → unknown) are not the frozen map."

  - id: fema
    hazard: multi
    status: approved
    frozen: true
    source: "docs/eval_protocol.md Label section, FEMA damage assessment records"
    notes: "FEMA mapping stays frozen."

official_grade_system:
  source_id: paulik_2019
  frozen: false
  is_main_conclusion: false
  write_to_official_protocol_as_frozen: false
  applied_to_official_y: false
  scale: DL0_to_DL3
  not_ds0_ds3: true
  scheme_basis: "PDF p. 3 (journal 3307): four-state ordinal damage division similar to Peiris (2006), ranging from DL0 (No damage) to DL3 (Complete damage)."
  table: "PDF p. 4 (journal 3308), Table 1, Assignment of damage levels to tsunami affected structures in Palu City"
  definitions:
    DL0: "No damage"
    DL1: "Partial damage, repairable"
    DL2: "Partial damage, unrepairable"
    DL3: "Complete damage"
  xlsx_damage_level_labels:
    - "No Damage"
    - "Partial Damage, Repairable"
    - "Partial Damage, Unrepairable"
    - "Complete Damage"
  notes: "These are Paulik's own grade definitions, inventoried from the official PDF Table 1 and matching the publisher Buildings-sheet Damage Level labels (capitalization differs slightly). They are not a freeze of official Y and are not a completed Palu mapping. Earlier DS0-DS3 candidate schemes are a different grade vocabulary and must not be applied as the mapping."

palu_mapping:
  status: pending_decision
  frozen: false
  is_main_conclusion: false
  write_to_official_protocol_as_frozen: false
  primary_source_id: paulik_2019
  official_protocol_statements:
    - "Palu is not one-to-one and is not frozen until Paulik et al. (2019) is in hand."
    - "DS1 → unknown or excluded from a strict crosswalk."
    - "DS2/DS3 only as exploratory sensitivity."
    - "Paulik et al., 2019, Pure and Applied Geophysics 176:3305–3321, doi:10.1007/s00024-019-02254-9. Full text not obtained."
