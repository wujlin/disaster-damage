# Event identities for the SAGIN–xBD overlap audit.
#
# An id is date-specific. Matching uses exact aliases, xView2 filename slugs,
# and match_all token rules. It does not fuzzy-match a shared word such as
# "flood". match_all tokens are stemmed in code (flooding -> flood, wildfires -> fire).
#
# xBD dates and tiers: Gupta et al., arXiv:1911.09296, Table 1.
# Filename slugs are the xView2 image prefixes (for example pinery-bushfire).
# Strings that do not match are listed in the audit report so a local release
# can be added here.
#
# SAGIN example events: Li et al., ProbGLC (ISPRS 2026), and the SAGINGeo
# abstract (IEEE JSTARS, DOI 10.1109/JSTARS.2026.3712316). The seven names are
# examples. ProbGLC also says the archive draws on more than 50 NOAA events.
# Year-only ranges are used where the source prints a year and not a day.

ambiguous_names:
  - midwest flood
  - midwest flooding
  - midwest us flooding
  - california fire
  - california wildfire
  - california wildfires
  - tornado
  - flood
  - fire
  - wildfire

review_only:
  - left: midwest-us-flooding-2015
    right: midwest-us-floods-2019
    reason: "Same basin wording, different years. SAGIN's example is 2015. xBD Midwest US floods are 3 Jan–31 May 2019."
  - left: california-fire-2025
    right: santa-rosa-wildfires-2017
    reason: "Both are California fires. 2025 is not the Santa Rosa fires of October 2017."
  - left: california-fire-2025
    right: carr-wildfire-2018
    reason: "Carr (xView2 slug socal-fire) is Jul–Aug 2018, not the 2025 California fires."
  - left: california-fire-2025
    right: woolsey-fire-2018
    reason: "Woolsey is November 2018, not the 2025 California fires."
  - left: illinois-tornado-2015
    right: joplin-tornado-2011
    reason: "Illinois 2015 and Joplin 2011 are different tornadoes."
  - left: illinois-tornado-2015
    right: moore-tornado-2013
    reason: "Illinois 2015 and Moore 2013 are different tornadoes."
  - left: illinois-tornado-2015
    right: tuscaloosa-tornado-2011
    reason: "Illinois 2015 and Tuscaloosa 2011 are different tornadoes."
  - left: louisiana-flood-2016
    right: hurricane-harvey-2017
    reason: "Harvey is 2017. The Louisiana flood named in the SAGIN example is 2016."
  - left: louisiana-flood-2016
    right: hurricane-matthew-2016
    reason: "Matthew (Sep–Oct 2016) and the 2016 Louisiana flood are different events."
  - left: nashville-tornado-2020
    right: ""
    reason: "2020 is after the xBD events. None of the xBD tornadoes use this name."
  - left: maui-fire-2023
    right: ""
    reason: "Maui 2023 is not an xBD event."
  - left: hurricane-ian-2022
    right: ""
    reason: "Ian (landfall 28 Sep 2022) is not an xBD hurricane. xBD hurricanes are Harvey, Matthew, Florence, and Michael. One ProbGLC sentence writes IAN (2025); that year is not used."

