[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvbridge"
version = "0.1.0"
description = "Week-1 scaffold for multi-view DINO adaptation on disaster imagery and an official-split xBD damage baseline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mvbridge = "mvbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
